<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>梦幻电子烟花 (慢动作音效版)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; touch-action: none; }
        canvas { display: block; }
        .hint {
            position: fixed;
            bottom: 10%;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 14px;
            pointer-events: none;
            animation: fadeInOut 4s infinite;
        }
        @keyframes fadeInOut {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="hint">✨ 点击屏幕任意位置，开启声音并绽放烟花 ✨</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let W, H;

        // 音频上下文 (用于合成音效)
        let audioCtx = null;

        // 初始化音频 (必须在用户点击后触发，否则浏览器会静音)
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 合成发射音效 (嗖~)
        function playLaunchSound() {
            if (!audioCtx) return;
            const duration = 0.8;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + duration);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // 合成爆炸音效 (砰！+ 碎裂声)
        function playExplosionSound() {
            if (!audioCtx) return;
            const duration = 1.5;
            
            // 1. 碎裂声 (白噪声 + 低通滤波)
            const bufferSize = audioCtx.sampleRate * duration;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2.5); 
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1200, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + duration);
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            noise.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noise.start();
            noise.stop(audioCtx.currentTime + duration);

            // 2. 沉闷的爆炸低音 (砰)
            const osc = audioCtx.createOscillator();
            const oscGain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.4);
            oscGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            oscGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.connect(oscGain);
            oscGain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        // 适配屏幕
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        const random = (min, max) => Math.random() * (max - min) + min;
        const randomInt = (min, max) => Math.floor(random(min, max + 1));

        const dreamColors = [
            [330, 100, 70], [280, 100, 75], [200, 100, 65], 
            [160, 100, 60], [45, 100, 65], [10, 100, 65]
        ];

        class Particle {
            constructor(x, y, color, velocity, size) {
                this.x = x; this.y = y;
                this.color = color;
                this.velocity = velocity;
                this.size = size;
                this.alpha = 1;
                // 【修改】降低消失速度，让烟花停留更久
                this.decay = random(0.003, 0.012); 
                // 【修改】降低重力，让飘落更轻柔
                this.gravity = 0.02; 
                // 【修改】减小摩擦力，让粒子飘得更远
                this.friction = 0.985; 
                this.twinkle = Math.random() > 0.5;
            }

            update() {
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;
                this.velocity.y += this.gravity;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                if (this.twinkle && Math.random() > 0.5) ctx.globalAlpha *= 0.5;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        class Rocket {
            constructor(x, y, targetX, targetY) {
                this.x = x; this.y = y;
                this.targetX = targetX; this.targetY = targetY;
                // 【修改】降低火箭上升速度
                this.speed = 2.5; 
                this.angle = Math.atan2(targetY - y, targetX - x);
                this.velocity = { x: Math.cos(this.angle) * this.speed, y: Math.sin(this.angle) * this.speed };
                this.distanceToTarget = Math.sqrt((targetX - x) ** 2 + (targetY - y) ** 2);
                this.distanceTraveled = 0;
                this.trail = [];
                this.trailLength = 8; // 尾迹变长
                this.color = `hsl(${randomInt(20, 50)}, 100%, 70%)`;
                
                // 播放发射声音
                playLaunchSound();
            }

            update() {
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > this.trailLength) this.trail.shift();

                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.distanceTraveled += this.speed;

                if (this.distanceTraveled >= this.distanceToTarget) {
                    explode(this.targetX, this.targetY);
                    return true; 
                }
                return false;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                
                for (let i = 0; i < this.trail.length; i++) {
                    ctx.beginPath();
                    ctx.arc(this.trail[i].x, this.trail[i].y, 1.5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 200, 100, ${i / this.trail.length})`;
                    ctx.fill();
                }
            }
        }

        let rockets = [];
        let particles = [];

        function explode(x, y) {
            // 播放爆炸声音
            playExplosionSound();

            const colorBase = dreamColors[randomInt(0, dreamColors.length - 1)];
            const particleCount = randomInt(100, 180);
            const isHeart = Math.random() > 0.6; 

            for (let i = 0; i < particleCount; i++) {
                let angle, speed;
                
                if (isHeart) {
                    let t = (i / particleCount) * Math.PI * 2;
                    let r = 1;
                    let hx = r * (16 * Math.pow(Math.sin(t), 3));
                    let hy = -r * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                    speed = random(0.05, 0.15); // 【修改】心形散开速度变慢
                    angle = Math.atan2(hy, hx);
                    speed = Math.sqrt(hx*hx + hy*hy) * speed * 0.15;
                } else {
                    angle = random(0, Math.PI * 2);
                    speed = random(0.8, 3.5); // 【修改】圆形散开速度变慢
                }

                let h = colorBase[0] + random(-15, 15);
                let s = colorBase[1];
                let l = colorBase[2] + random(-10, 10);
                let color = `hsl(${h}, ${s}%, ${l}%)`;

                particles.push(new Particle(
                    x, y, color,
                    { x: Math.cos(angle) * speed, y: Math.sin(angle) * speed },
                    random(1.5, 3)
                ));
            }
        }

        function launchRocket(x, y) {
            const startX = random(W * 0.2, W * 0.8);
            const startY = H;
            rockets.push(new Rocket(startX, startY, x, y));
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, W, H);
            ctx.globalCompositeOperation = 'lighter';

            for (let i = rockets.length - 1; i >= 0; i--) {
                rockets[i].draw();
                if (rockets[i].update()) rockets.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) particles.splice(i, 1);
            }

            ctx.globalCompositeOperation = 'source-over';
        }

        // 【修改】自动发射频率变慢，避免画面太乱
        setInterval(() => {
            launchRocket(random(W * 0.1, W * 0.9), random(H * 0.1, H * 0.4));
        }, 2200);

        function handleInteraction(e) {
            e.preventDefault();
            // 唤醒音频上下文 (极其重要)
            initAudio(); 

            let x, y;
            if (e.touches) {
                x = e.touches[0].clientX;
                y = e.touches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }
            for(let i=0; i<2; i++){ // 改为连续发射2颗
                setTimeout(() => launchRocket(x + random(-30, 30), y + random(-30, 30)), i * 200);
            }
        }

        canvas.addEventListener('click', handleInteraction);
        canvas.addEventListener('touchstart', handleInteraction);

        animate();
        setTimeout(() => launchRocket(W/2, H/3), 500);
    </script>
</body>
</html>
