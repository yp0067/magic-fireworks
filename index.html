<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>梦幻电子烟花</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; touch-action: none; }
        canvas { display: block; }
        .hint {
            position: fixed;
            bottom: 10%;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 14px;
            pointer-events: none;
            animation: fadeInOut 4s infinite;
        }
        @keyframes fadeInOut {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="hint">✨ 点击屏幕任意位置，绽放专属烟花 ✨</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let W, H;

        // 适配手机和电脑屏幕
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // 工具函数
        const random = (min, max) => Math.random() * (max - min) + min;
        const randomInt = (min, max) => Math.floor(random(min, max + 1));

        // 梦幻配色库 (HSL)
        const dreamColors = [
            [330, 100, 70], // 樱花粉
            [280, 100, 75], // 梦幻紫
            [200, 100, 65], // 星空蓝
            [160, 100, 60], // 极光绿
            [45, 100, 65],  // 璀璨金
            [10, 100, 65]   // 晚霞橘
        ];

        // 粒子类
        class Particle {
            constructor(x, y, color, velocity, size) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.velocity = velocity;
                this.size = size;
                this.alpha = 1;
                this.decay = random(0.01, 0.025); // 消失速度
                this.gravity = 0.05;
                this.friction = 0.98;
                this.twinkle = Math.random() > 0.5; // 是否闪烁
            }

            update() {
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;
                this.velocity.y += this.gravity;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                // 闪烁效果
                if (this.twinkle && Math.random() > 0.5) {
                    ctx.globalAlpha *= 0.5;
                }
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // 烟花火箭类
        class Rocket {
            constructor(x, y, targetX, targetY) {
                this.x = x;
                this.y = y;
                this.targetX = targetX;
                this.targetY = targetY;
                this.speed = 4;
                this.angle = Math.atan2(targetY - y, targetX - x);
                this.velocity = { x: Math.cos(this.angle) * this.speed, y: Math.sin(this.angle) * this.speed };
                this.distanceToTarget = Math.sqrt((targetX - x) ** 2 + (targetY - y) ** 2);
                this.distanceTraveled = 0;
                this.trail = [];
                this.trailLength = 5;
                this.color = `hsl(${randomInt(20, 50)}, 100%, 70%)`;
            }

            update() {
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > this.trailLength) this.trail.shift();

                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.distanceTraveled += this.speed;

                if (this.distanceTraveled >= this.distanceToTarget) {
                    explode(this.targetX, this.targetY);
                    return true; // 标记为销毁
                }
                return false;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                
                // 绘制尾迹
                for (let i = 0; i < this.trail.length; i++) {
                    ctx.beginPath();
                    ctx.arc(this.trail[i].x, this.trail[i].y, 1.5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 200, 100, ${i / this.trail.length})`;
                    ctx.fill();
                }
            }
        }

        let rockets = [];
        let particles = [];

        // 爆炸逻辑 (包含圆形和心形)
        function explode(x, y) {
            const colorBase = dreamColors[randomInt(0, dreamColors.length - 1)];
            const particleCount = randomInt(80, 150);
            const isHeart = Math.random() > 0.6; // 40% 概率心形

            for (let i = 0; i < particleCount; i++) {
                let angle, speed;
                
                if (isHeart) {
                    // 心形参数方程
                    let t = (i / particleCount) * Math.PI * 2;
                    let r = 1;
                    let hx = r * (16 * Math.pow(Math.sin(t), 3));
                    let hy = -r * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                    speed = random(0.1, 0.3);
                    angle = Math.atan2(hy, hx);
                    speed = Math.sqrt(hx*hx + hy*hy) * speed * 0.15;
                } else {
                    // 圆形
                    angle = random(0, Math.PI * 2);
                    speed = random(1, 6);
                }

                // 颜色微调，产生渐变感
                let h = colorBase[0] + random(-15, 15);
                let s = colorBase[1];
                let l = colorBase[2] + random(-10, 10);
                let color = `hsl(${h}, ${s}%, ${l}%)`;

                particles.push(new Particle(
                    x, y, color,
                    { x: Math.cos(angle) * speed, y: Math.sin(angle) * speed },
                    random(1.5, 3.5)
                ));
            }
        }

        // 发射烟花
        function launchRocket(x, y) {
            const startX = random(W * 0.2, W * 0.8);
            const startY = H;
            rockets.push(new Rocket(startX, startY, x, y));
        }

        // 主渲染循环
        function animate() {
            requestAnimationFrame(animate);

            // 拖尾效果：用半透明黑色覆盖上一层
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, W, H);

            // 开启发光混合模式 (这是梦幻感的核心)
            ctx.globalCompositeOperation = 'lighter';

            // 更新和绘制火箭
            for (let i = rockets.length - 1; i >= 0; i--) {
                rockets[i].draw();
                if (rockets[i].update()) {
                    rockets.splice(i, 1);
                }
            }

            // 更新和绘制粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            // 恢复正常混合模式
            ctx.globalCompositeOperation = 'source-over';
        }

        // 自动发射 (防止冷场)
        setInterval(() => {
            launchRocket(random(W * 0.1, W * 0.9), random(H * 0.1, H * 0.4));
        }, 1200);

        // 交互事件 (兼容手机和电脑)
        function handleInteraction(e) {
            e.preventDefault();
            let x, y;
            if (e.touches) {
                x = e.touches[0].clientX;
                y = e.touches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }
            // 连续发射3颗
            for(let i=0; i<3; i++){
                setTimeout(() => launchRocket(x + random(-30, 30), y + random(-30, 30)), i * 150);
            }
        }

        canvas.addEventListener('click', handleInteraction);
        canvas.addEventListener('touchstart', handleInteraction);

        // 初始化
        animate();
        // 开场烟花
        setTimeout(() => launchRocket(W/2, H/3), 500);
    </script>
</body>
</html>
